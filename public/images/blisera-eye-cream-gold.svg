  </g>
  <text font-family="Arial,sans-serif" font-size="28" fill="white" text-anchor="middle" x="400" y="540" opacity="0.85" font-weight="bold">Eye Cream Gold</text>
  <text font-family="Arial,sans-serif" font-size="18" fill="white" text-anchor="middle" x="400" y="580" opacity="0.6">BLISERA</text>
